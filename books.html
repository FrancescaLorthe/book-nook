<script src="cart.js"></script>

<script>
  // NAV TOGGLE
  document.querySelector('.nav-toggle').addEventListener('click', function () {
    document.querySelector('nav').classList.toggle('active');
  });

  // 🔥 AUTO ADD SAVE BUTTONS TO ALL BOOKS
  const bookCards = document.querySelectorAll(".book-card, .staff-pick-card");

  bookCards.forEach((card) => {
    const titleEl = card.querySelector("h3");
    const addBtn = card.querySelector(".add-to-cart");

    if (!titleEl || !addBtn) return;

    const title = titleEl.textContent.trim();

    // Create Save Button
    const saveBtn = document.createElement("button");
    saveBtn.className = "btn save-book";
    saveBtn.setAttribute("data-title", title);
    saveBtn.textContent = "🤍 Save";

    addBtn.insertAdjacentElement("afterend", saveBtn);
  });

  // 🔥 SAVE FEATURE LOGIC
  let savedBooks = JSON.parse(localStorage.getItem("savedBooks")) || [];

  const saveButtons = document.querySelectorAll(".save-book");

  function updateButtons() {
    saveButtons.forEach((btn) => {
      const title = btn.dataset.title;

      if (savedBooks.includes(title)) {
        btn.textContent = "❤️ Saved";
      } else {
        btn.textContent = "🤍 Save";
      }
    });
  }

  saveButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const title = btn.dataset.title;

      if (savedBooks.includes(title)) {
        savedBooks = savedBooks.filter((b) => b !== title);
      } else {
        savedBooks.push(title);
      }

      localStorage.setItem("savedBooks", JSON.stringify(savedBooks));
      updateButtons();
    });
  });

  updateButtons();
</script>

</body>

</html>
